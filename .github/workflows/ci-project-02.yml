name: CI Project-02 (Build Image)

on:
  push:
    branches: [main]
    paths: 
      - 'project-02/**'
      - '.github/workflows/ci-project-02.yml'    

  pull_request:
    branches: [main]
    paths: 
      - 'project-02/**'
      - '.github/workflows/ci-project-02.yml'

  workflow_dispatch:


defaults:
  run:
    working-directory: './project-02'
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      $IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Buildx Docker
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build Image
        run: docker buildx build \
              --rm \
              --load \
              --cache-to type=gha,mode=max \
              --cache-from type=gha,mode=max \
              --tag python-ci:${{ github.sha }} \
              .

      - name: Run Docker
        run: docker run -d -p 5000:5000 --name my-app syfiq/myapp:latest

      - name: Docker ps
        run: docker container ls

      - name: Docker Stop
        run: docker container stop my-app

      - name: Remove Container
        run: docker rm my-app


