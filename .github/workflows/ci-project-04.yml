
name: CI Project 04 - Docker External Cache

on:
  push:
    branches: [main]
    paths:
      - 'project-04/**'
      - '.github/workflows/ci-project-04.yml'

  pull_request:
    branches: [main]
    paths:
      - 'project-04/**'
      - '.github/workflows/ci-project-04.yml'

  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./project-04
        shell: bash

    env:
      IMAGE_NAME: python-ci
      IMAGE_TAG: ${{ github.sha }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Inspect Buildx
        run: |
          docker buildx version
          docker buildx ls
          docker buildx inspect --bootstrap

      - name: Prepare Cache Scope
        id: cache-scope
        run: |
          BRANCH_SCOPE=$(echo "$BRANCH_NAME" | tr '/' '-')
          echo "name=project-04-${BRANCH_SCOPE}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        env:
          CACHE_SCOPE: ${{ steps.cache-scope.outputs.name }}
        run: |
          docker buildx build \
            --progress=plain \
            --cache-from type=gha,scope=$CACHE_SCOPE \
            --cache-from type=gha,scope=project-04-main \
            --cache-to type=gha,mode=max,scope=$CACHE_SCOPE \
            --load \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Inspect Docker Image
        run: |
          docker image inspect "$IMAGE_NAME:$IMAGE_TAG"

      - name: Run Ruff
        run: |
          docker run --rm \
            "$IMAGE_NAME:$IMAGE_TAG" \
            ruff check .

      - name: Run Pytest
        run: |
          docker run --rm \
            "$IMAGE_NAME:$IMAGE_TAG" \
            python -m pytest -v

      - name: Debug Docker
        if: failure()
        run: |
          docker images
          docker ps -a
          docker buildx ls

      - name: Cleanup
        if: always()
        run: |
          docker rmi "$IMAGE_NAME:$IMAGE_TAG" || true

