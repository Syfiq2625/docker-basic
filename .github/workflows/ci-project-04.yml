
name: Docker CI Project 04

on:
  push:
    branches: [main]
    paths:
      - 'project-04/**'
      - '.github/workflows/ci-project-04.yml'

  pull_request:
    branches: [main]
    paths:
      - 'project-04/**'
      - '.github/workflows/ci-project-04.yml'

  workflow_dispatch:

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./project-04
        shell: bash

    env:
      IMAGE_NAME: python-ci
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Environment Check
        run: |
          docker --version
          docker info

      - name: Build Docker Image
        run: |
          docker build \
            --progress=plain \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Inspect Docker Image
        run: |
          docker image inspect "$IMAGE_NAME:$IMAGE_TAG"

      - name: Run Ruff
        run: |
          docker run --rm "$IMAGE_NAME:$IMAGE_TAG" \
            ruff check .

      - name: Run Unit Tests
        run: |
          docker run --rm "$IMAGE_NAME:$IMAGE_TAG" \
            python -m pytest -v

      - name: Docker Debugging
        if: failure()
        run: |
          docker ps -a
          docker images

      - name: Cleanup
        if: always()
        run: |
          docker rmi "$IMAGE_NAME:$IMAGE_TAG" || true

