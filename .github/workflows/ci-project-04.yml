
name: Docker CI Project 04

on:
  push:
    branches: [main]
    paths:
      - 'project-04/**'
      - '.github/workflows/ci-project-04.yml'

  pull_request:
    branches: [main]
    paths:
      - 'project-04/**'
      - '.github/workflows/ci-project-04.yml'

  workflow_dispatch:

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./project-04
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx Docker
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Docker Buildx Inspect
        run: docker buildx inspect --bootstrap

      - name: Build Docker Image
        run: |
          docker buildx build \
            --load \
            --tag python-ci:${{ github.sha }} \
            .

      - name: Inspect Docker Image
        run: |
          docker image inspect python-ci:${{ github.sha }}

      - name: Run Ruff
        run: |
          docker run --rm \
            python-ci:${{ github.sha }} \
            ruff check .

      - name: Run Unit Tests
        run: |
          docker run --rm \
            python-ci:${{ github.sha }} \
            python -m pytest -v

      - name: Cleanup
        if: always()
        run: |
          docker image rm python-ci:${{ github.sha }} || true

